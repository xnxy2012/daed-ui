name: Build daed full (with dae log panel)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string embedded in the binary (e.g. 1.28.0-log)'
        required: false
        default: '0.0.0-custom'
      wing_ref:
        description: 'dae-wing ref to build: main, a tag/commit, or "pinned" to keep the commit this repo pins'
        required: false
        default: 'main'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: latest

      - name: Build web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm install
          pnpm build --filter daed

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: apps/web/dist

  build-bundle:
    needs: build-web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: amd64, goamd64: v1 }
          - { goos: linux, goarch: amd64, goamd64: v3 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
      CGO_ENABLED: 0

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Get version / filename
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${INPUT_VERSION//[[:space:]]/}"
            VERSION="${VERSION:-0.0.0-custom}"
          fi
          NAME=$(jq ".[\"$GOOS-$GOARCH$GOAMD64\"].friendlyName" -r < install/friendly-filenames.json)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "BUNDLE_NAME=daed-$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        with:
          name: web
          path: dist/

      - name: Switch dae-wing (and its dae-core) to the requested ref
        env:
          WING_REF: ${{ github.event.inputs.wing_ref }}
        run: |
          REF="${WING_REF//[[:space:]]/}"
          REF="${REF:-main}"
          if [ "$REF" = "pinned" ]; then
            echo "Keeping the pinned dae-wing commit"
          else
            git -C wing fetch --depth=1 origin "$REF"
            git -C wing checkout -f FETCH_HEAD
            git -C wing submodule sync --recursive
            git -C wing submodule update --init --recursive --depth 1
          fi
          echo "dae-wing : $(git -C wing log -1 --format='%h %cd %s')"
          echo "dae-core : $(git -C wing/dae-core describe --tags --always 2>/dev/null || git -C wing/dae-core rev-parse --short HEAD)"
          grep -n "^go " wing/go.mod

      # Native log stream for dae-wing: GET /logs (SSE, same port and JWT auth as /graphql).
      - name: Inject dae-wing log stream
        run: python3 wing-patches/apply.py wing

      # Live traffic stats: upstream only accounts offloaded TCP flows when they close.
      - name: Patch dae-core live traffic accounting
        run: python3 wing-patches/apply_dae_traffic.py wing/dae-core

      # Diagnostics only: shows which dae-core is really being built and where traffic bytes are recorded.
      - name: Diagnose dae-core traffic accounting
        continue-on-error: true
        run: |
          echo "== wing commit";      git -C wing rev-parse --short HEAD || true
          echo "== dae-core version"; git -C wing/dae-core describe --tags --always || true
          echo "== dae-core commit";  git -C wing/dae-core log -1 --format='%h %cd %s' || true
          echo "== control dir";      ls wing/dae-core/control | tr '\n' ' ' || true; echo
          echo "== offload file";     ls wing/dae-core/control/tcp_offload_linux.go 2>&1 || true
          echo "== patch marker";     grep -c flushLiveTraffic wing/dae-core/control/tcp_offload_linux.go 2>&1 || true
          echo "== traffic recorders"
          grep -rnE "Record(Upload|Download)Traffic|(upload|download)Recorder" wing/dae-core/control --include=*.go | grep -v _test | head -40 || true
          echo "== snapshot users";   grep -rn "SnapshotRuntimeStats" wing --include=*.go | head || true

      - name: make
        run: |
          mkdir -p ./bundled/
          export VERSION="${{ steps.meta.outputs.VERSION }}"
          export GOFLAGS="-trimpath -modcacherw"
          export OUTPUT="bundled/${{ steps.meta.outputs.BUNDLE_NAME }}"
          make SKIP_SUBMODULES=1
          cp ./install/daed.service ./bundled/
          cp ./install/daed.desktop ./bundled/
          cp -r ./install/icons/ ./bundled/
          curl -L -o ./bundled/geoip.dat https://github.com/v2rayA/dist-v2ray-rules-dat/raw/master/geoip.dat
          curl -L -o ./bundled/geosite.dat https://github.com/v2rayA/dist-v2ray-rules-dat/raw/master/geosite.dat

      - name: Smoke test
        if: matrix.goarch == 'amd64' && matrix.goamd64 == 'v1'
        run: ./bundled/${{ steps.meta.outputs.BUNDLE_NAME }} --version

      - name: Zip
        run: |
          cd bundled
          zip -9r ../${{ steps.meta.outputs.BUNDLE_NAME }}.zip .
          cd ..
          sha256sum ${{ steps.meta.outputs.BUNDLE_NAME }}.zip > ${{ steps.meta.outputs.BUNDLE_NAME }}.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.BUNDLE_NAME }}
          path: |
            ${{ steps.meta.outputs.BUNDLE_NAME }}.zip
            ${{ steps.meta.outputs.BUNDLE_NAME }}.zip.sha256

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.meta.outputs.BUNDLE_NAME }}.zip
            ${{ steps.meta.outputs.BUNDLE_NAME }}.zip.sha256
